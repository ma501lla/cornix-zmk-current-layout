name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  SOURCE_CONFIG_DIR: ${{ github.workspace }}/config
  ZMK_BUILD_BASE: /tmp/zmk-config
  ZMK_CONFIG_DIR: /tmp/zmk-config/config
  CORNIX_MODULE_DIR: /tmp/zmk-config/zmk-keyboard-cornix
  CORNIX_BOARD_DIR: /tmp/zmk-config/zmk-keyboard-cornix/boards/jzf/cornix
  ARTIFACT_DIR: /tmp/zmk-firmware-artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare west workspace
        run: |
          mkdir -p "${ZMK_CONFIG_DIR}"
          cp -R "${SOURCE_CONFIG_DIR}"/* "${ZMK_CONFIG_DIR}/"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/zmk-config/config/cornix.keymap')
          text = path.read_text()
          for name in [
              'mac_tile_left_hold', 'mac_tile_up_hold', 'mac_tile_down_hold', 'mac_tile_right_hold',
              'win_tile_left_hold', 'win_tile_up_hold', 'win_tile_down_hold', 'win_tile_right_hold',
              'win_clipboard_hold',
          ]:
              text = text.replace(
                  f'{name}: {name} {{\n            compatible = "zmk,behavior-hold-tap";\n            #binding-cells = <1>;',
                  f'{name}: {name} {{\n            compatible = "zmk,behavior-hold-tap";\n            #binding-cells = <2>;'
              )
          mac_globe_replacements = {
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(LA(LEFT))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp LEFT>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(LA(RIGHT))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp RIGHT>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(LA(UP))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp UP>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(LA(DOWN))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp DOWN>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(GLOBE(LEFT))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp LEFT>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(GLOBE(RIGHT))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp RIGHT>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(GLOBE(UP))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp UP>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
              '<&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LC(GLOBE(DOWN))>, <&macro_press &kp LEFT_SHIFT>': '<&macro_release &kp LEFT_SHIFT>, <&macro_press &kp LEFT_CONTROL>, <&macro_press &kp GLOBE>, <&macro_tap &kp DOWN>, <&macro_release &kp GLOBE>, <&macro_release &kp LEFT_CONTROL>, <&macro_press &kp LEFT_SHIFT>',
          }
          for old, new in mac_globe_replacements.items():
              text = text.replace(old, new)
          text = text.replace('bindings = <&kp LG(V)>, <&kp>;', 'bindings = <&shift_win_clipboard>, <&kp>;')
          if 'shift_win_clipboard: shift_win_clipboard' not in text:
              insert = (
                  '        shift_win_clipboard: shift_win_clipboard {\n'
                  '            compatible = "zmk,behavior-macro";\n'
                  '            #binding-cells = <0>;\n'
                  '            wait-ms = <0>;\n'
                  '            tap-ms = <20>;\n'
                  '            bindings = <&macro_release &kp LEFT_SHIFT>, <&macro_tap &kp LG(V)>, <&macro_press &kp LEFT_SHIFT>;\n'
                  '        };\n'
                  '        macro_shift_space_n: macro_shift_space_n {'
              )
              text = text.replace('        macro_shift_space_n: macro_shift_space_n {', insert)
          replacements = {
              '&mac_tile_up_hold E': '&mac_tile_up_hold 0 E',
              '&mac_tile_left_hold S': '&mac_tile_left_hold 0 S',
              '&mac_tile_down_hold D': '&mac_tile_down_hold 0 D',
              '&mac_tile_right_hold F': '&mac_tile_right_hold 0 F',
              '&win_tile_up_hold E': '&win_tile_up_hold 0 E',
              '&win_tile_left_hold S': '&win_tile_left_hold 0 S',
              '&win_tile_down_hold D': '&win_tile_down_hold 0 D',
              '&win_tile_right_hold F': '&win_tile_right_hold 0 F',
              '&win_clipboard_hold V': '&win_clipboard_hold 0 V',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          mouse_replacements = {
              '&none  &none  &none  &mmv MOVE_UP  &none  &none  &none  &none  &none  &none  &none  &none\n&none  &none  &mmv MOVE_LEFT  &mmv MOVE_DOWN  &mmv MOVE_RIGHT  &none  &none  &mouse_boost_click 10 LCLK  &none  &mkp RCLK  &none  &none\n&none  &none  &none  &none  &none  &none  &kp C_MUTE  &none  &none  &none  &none  &none  &none  &none\n&none  &none  &none  &msc SCRL_DOWN  &kp PG_DN  &kp PG_UP  &none  &none  &none  &none  &none  &to 4': '&none  &none  &none  &mmv MOVE_Y(-3600)  &none  &none  &none  &none  &none  &none  &none  &none\n&none  &none  &mmv MOVE_X(-3600)  &mmv MOVE_Y(3600)  &mmv MOVE_X(3600)  &none  &none  &mkp LCLK  &none  &mkp RCLK  &none  &none\n&none  &none  &none  &none  &none  &none  &kp C_MUTE  &none  &none  &none  &none  &none  &none  &none\n&none  &none  &none  &msc SCRL_DOWN  &kp PG_DN  &kp PG_UP  &none  &mo 10  &none  &none  &none  &to 4',
              'display-name = "Mouse Boost";': 'display-name = "Mouse Standard";',
              '&trans  &trans  &trans  &mmv MOVE_Y(-1200)  &trans  &trans  &trans  &trans  &trans  &trans  &trans  &trans\n&trans  &trans  &mmv MOVE_X(-1200)  &mmv MOVE_Y(1200)  &mmv MOVE_X(1200)  &trans  &trans  &trans  &trans  &trans  &trans  &trans': '&trans  &trans  &trans  &mmv MOVE_UP  &trans  &trans  &trans  &trans  &trans  &trans  &trans  &trans\n&trans  &trans  &mmv MOVE_LEFT  &mmv MOVE_DOWN  &mmv MOVE_RIGHT  &trans  &trans  &trans  &trans  &trans  &trans  &trans',
          }
          for old, new in mouse_replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cd "${ZMK_BUILD_BASE}"
          west init -l "${ZMK_CONFIG_DIR}"
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Patch Cornix board qualifiers
        shell: bash
        run: |
          set -euo pipefail

          cp "${CORNIX_BOARD_DIR}/cornix_left.dts" "${CORNIX_BOARD_DIR}/cornix_left_nrf52840_zmk.dts"
          cp "${CORNIX_BOARD_DIR}/cornix_left_defconfig" "${CORNIX_BOARD_DIR}/cornix_left_nrf52840_zmk_defconfig"
          cp "${CORNIX_BOARD_DIR}/cornix_right.dts" "${CORNIX_BOARD_DIR}/cornix_right_nrf52840_zmk.dts"
          cp "${CORNIX_BOARD_DIR}/cornix_right_defconfig" "${CORNIX_BOARD_DIR}/cornix_right_nrf52840_zmk_defconfig"
          cp "${CORNIX_BOARD_DIR}/cornix_ph_left.dts" "${CORNIX_BOARD_DIR}/cornix_ph_left_nrf52840_zmk.dts"
          cp "${CORNIX_BOARD_DIR}/cornix_ph_left_defconfig" "${CORNIX_BOARD_DIR}/cornix_ph_left_nrf52840_zmk_defconfig"

          cat > "${CORNIX_BOARD_DIR}/board.yml" <<'EOF'
          boards:
            - name: cornix_left
              vendor: jzf
              socs:
                - name: nrf52840
                  variants:
                    - name: zmk
              revision:
                format: major.minor.patch
                default: 1.0.0
                revisions:
                  - name: 1.0.0
            - name: cornix_right
              vendor: jzf
              socs:
                - name: nrf52840
                  variants:
                    - name: zmk
              revision:
                format: major.minor.patch
                default: 1.0.0
                revisions:
                  - name: 1.0.0
            - name: cornix_ph_left
              vendor: jzf
              socs:
                - name: nrf52840
                  variants:
                    - name: zmk
              revision:
                format: major.minor.patch
                default: 1.0.0
                revisions:
                  - name: 1.0.0
          EOF

          python3 - <<'PY'
          from pathlib import Path
          for name in ["cornix_left", "cornix_right", "cornix_ph_left"]:
              path = Path("/tmp/zmk-config/zmk-keyboard-cornix/boards/jzf/cornix") / f"Kconfig.{name}"
              text = path.read_text()
              if "select ZMK_BOARD_COMPAT" not in text:
                  text = text.replace("    select SOC_NRF52840_QIAA\n", "    select SOC_NRF52840_QIAA\n    select ZMK_BOARD_COMPAT\n")
              path.write_text(text)
          PY

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "${ZMK_BUILD_BASE}"
          mkdir -p "${ARTIFACT_DIR}"

          build_one() {
            local board="$1"
            local artifact="$2"
            local shield="${3:-}"
            local snippet="${4:-}"
            local build_dir="/tmp/zmk-build-${artifact}"
            local cmake_args=(-DZMK_CONFIG="${ZMK_CONFIG_DIR}")

            if [ -n "${shield}" ]; then
              cmake_args+=(-DSHIELD="${shield}")
            fi
            if [ -n "${snippet}" ]; then
              cmake_args+=(-DSNIPPET="${snippet}")
            fi

            west build \
              -s "${ZMK_BUILD_BASE}/zmk/app" \
              -d "${build_dir}" \
              -b "${board}" \
              -- "${cmake_args[@]}"

            if [ -f "${build_dir}/zephyr/zmk.uf2" ]; then
              cp "${build_dir}/zephyr/zmk.uf2" "${ARTIFACT_DIR}/${artifact}.uf2"
            elif [ -f "${build_dir}/zephyr/zmk.bin" ]; then
              cp "${build_dir}/zephyr/zmk.bin" "${ARTIFACT_DIR}/${artifact}.bin"
            else
              echo "No firmware output found for ${artifact}" >&2
              exit 1
            fi
          }

          build_one "cornix_left@1.0.0//zmk" cornix_left cornix_layer9_led_test studio-rpc-usb-uart
          build_one "cornix_right@1.0.0//zmk" cornix_right cornix_layer9_led_test
          build_one "cornix_right@1.0.0//zmk" reset settings_reset

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ${{ env.ARTIFACT_DIR }}
